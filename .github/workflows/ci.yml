name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: check + test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No install step: the pure suites and the syntax check need no dependencies.
      - name: Syntax check
        run: npm run check
      - name: Unit tests
        run: npm test
